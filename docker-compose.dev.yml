# Local development overrides: hot reload, bind mounts, dev-stage images.
# Usage: docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build

services:
  backend:
    build:
      target: dev
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./apps/backend:/app
    environment:
      - ENVIRONMENT=development

  celery-worker:
    build:
      target: dev
    volumes:
      - ./apps/backend:/app

  celery-beat:
    build:
      target: dev
    volumes:
      - ./apps/backend:/app

  frontend:
    build:
      target: dev
    command: pnpm dev
    volumes:
      - ./apps/frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next_cache:/app/.next
    environment:
      - NODE_ENV=development

volumes:
  frontend_node_modules:
  frontend_next_cache:
