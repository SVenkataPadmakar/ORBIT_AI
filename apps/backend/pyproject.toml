[tool.poetry]
name = "ai-startup-copilot-backend"
version = "0.1.0"
description = "AI Startup Copilot — FastAPI backend, Celery workers, and LangGraph agent orchestration"
authors = ["AI Startup Copilot Team"]
packages = [{ include = "app" }]

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.115.0"
uvicorn = { extras = ["standard"], version = "^0.30.6" }
sqlalchemy = "^2.0.35"
asyncpg = "^0.29.0"
alembic = "^1.13.2"
pydantic = "^2.9.2"
pydantic-settings = "^2.5.2"
python-jose = { extras = ["cryptography"], version = "^3.3.0" }
passlib = { extras = ["argon2"], version = "^1.7.4" }
celery = "^5.4.0"
redis = "^5.0.8"
httpx = "^0.28.1"
langgraph = "^1.2.0"
langchain-core = "^1.4.0"
openai = "^1.47.1"
anthropic = "^0.34.2"
# google-generativeai is fully deprecated/archived (no updates since the
# google-genai unification) — using the current package instead. Pinned
# below 3.0 per the maintainers' own compatibility warning about upcoming
# Automatic Function Calling changes in the next major version.
google-genai = ">=1.60,<3.0"
google-generativeai = "^0.8.6"
chromadb = "^1.5.0"
stripe = "^10.11.0"
boto3 = "^1.35.24"
structlog = "^24.4.0"
sentry-sdk = { extras = ["fastapi"], version = "^2.14.0" }
authlib = "^1.3.2"
python-multipart = "^0.0.9"
python-pptx = "^1.0.2"
reportlab = "^4.2.2"
sse-starlette = "<3.0.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.3"
pytest-asyncio = "^0.24.0"
pytest-cov = "^5.0.0"
pytest-mock = "^3.14.0"
ruff = "^0.6.8"
mypy = "^1.11.2"
testcontainers = "^4.8.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
    "celery.*",
    "jose.*",
    "passlib.*",
    "authlib.*",
    "chromadb.*",
    "langgraph.*",
    "langchain_core.*",
    "google.genai.*",
    "pptx.*",
    "reportlab.*",
    "stripe.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
